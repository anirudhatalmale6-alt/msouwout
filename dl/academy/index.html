<!DOCTYPE html>
<html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LajanMaker Academy — apèsi</title><meta name="robots" content="noindex">
<style>
:root{--blue:#00209F;--red:#D21034;--ink:#0F172A;--muted:#5B6478;--bg:#F4F6FB;--card:#fff;--line:#E3E7EF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#EEF2FA;--muted:#A3AEC4;--bg:#0E1320;--card:#161D2D;--line:#2A3346}}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:0 16px 40px}
.stripe{height:4px;background:linear-gradient(90deg,var(--blue) 50%,var(--red) 50%);margin:0 -16px}.w{max-width:440px;margin:22px auto 0}
h1{font-size:1.25rem;margin-bottom:6px}.sub{color:var(--muted);font-size:.92rem;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:16px}.card h2{font-size:1rem;margin-bottom:8px}
img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
</style></head><body><div class="stripe"></div><div class="w">
<h1>LajanMaker Academy — apèsi (A + B)</h1>
<p class="sub">Tès sou yon kopi, pa sou sit la an dirèk. Dat, vil, adrès ak non yo se egzanp tès.</p>
<div class="card"><h2>1. Paj "ENSKRI KOUNYE A" (lyen anons Facebook la)</h2><img src="1-paj.jpg" alt=""></div>
<div class="card"><h2>2. De chwa: An pèsòn / Anliy — 1,000 HTG</h2><img src="2-chwa.jpg" alt=""></div>
<div class="card"><h2>3. Apre peman (an pèsòn): dat, lè, vil, adrès</h2><img src="3-konfime-an-peson.jpg" alt=""></div>
<div class="card"><h2>4. Lis Jennifer: Anliy / An pèsòn</h2><img src="4-lis-jennifer.jpg" alt=""></div>
</div></body></html>
