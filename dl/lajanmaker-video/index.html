<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LajanMaker — videyo app la</title>
<link rel="icon" href="../../assets/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#00209F;--red:#D21034;--text:#1A2A4A;--light:#5A6B8A;--border:#E2E8F0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);
  background:#0B1020;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:22px 16px 48px}
h1{color:#fff;font-size:1.3rem;font-weight:800;letter-spacing:-.02em;text-align:center}
.sub{color:#9AA7C0;font-size:.92rem;text-align:center;margin-top:6px}
/* The phone frame keeps the 412x880 recording looking like a phone instead of
   a letterboxed rectangle on a wide screen. */
.phone{margin:22px auto 0;max-width:340px;border-radius:26px;overflow:hidden;
  border:6px solid #1B2440;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.5)}
video{display:block;width:100%;height:auto}
.btn{display:block;text-align:center;text-decoration:none;background:var(--blue);
  color:#fff;padding:17px 16px;border-radius:14px;font-weight:800;margin-top:18px}
.note{color:#8A95AA;font-size:.82rem;text-align:center;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>LajanMaker Center</h1>
  <div class="sub">Videyo ekran an — 49 segonn</div>
  <div class="phone">
    <video controls playsinline preload="metadata" poster="">
      <source src="../lajanmaker-demo-26sep.mp4" type="video/mp4">
    </video>
  </div>
  <a class="btn" href="../lajanmaker-demo-26sep.mp4" download>⬇️ Telechaje videyo a</a>
  <div class="note">Ekran yo: paj akèy la, enskripsyon chofè, bouton +,
    sèvis ou ka vann, Kòb Ou Fè, kòd parenaj ou, ak paramèt yo.</div>
</div>
</body>
</html>
